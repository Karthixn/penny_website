<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Group — Penny</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0C0D14;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      text-align: center;
      max-width: 400px;
    }
    .logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      margin-bottom: 24px;
    }
    h1 { font-size: 24px; margin-bottom: 8px; }
    .code {
      display: inline-block;
      background: #1A1B23;
      border: 1px solid #2A2B35;
      border-radius: 12px;
      padding: 12px 24px;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 4px;
      color: #7C6FF7;
      margin: 20px 0;
      font-family: monospace;
    }
    .open-btn {
      display: inline-block;
      background: #7C6FF7;
      color: #fff;
      text-decoration: none;
      padding: 14px 40px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      margin: 16px 0;
      transition: opacity 0.2s;
    }
    .open-btn:hover { opacity: 0.9; }
    .subtitle {
      color: #888;
      font-size: 14px;
      margin-top: 16px;
      line-height: 1.5;
    }
    .store-link {
      color: #7C6FF7;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/public/images/penny_app_icon.png" alt="Penny" class="logo">
    <h1>You've been invited to a group!</h1>
    <div class="code" id="code"></div>
    <br>
    <a class="open-btn" id="openLink" href="#">Open in Penny</a>
    <p class="subtitle">
      Don't have Penny yet?<br>
      <a class="store-link" href="https://play.google.com/store/apps/details?id=com.penny.penny">Download on Google Play</a>
    </p>
  </div>
  <script>
    const path = window.location.pathname;
    const parts = path.split('/').filter(Boolean);
    let inviteCode = '';
    const codeIndex = parts.indexOf('invite');
    if (codeIndex !== -1 && parts[codeIndex + 1]) {
      inviteCode = parts[codeIndex + 1];
    }
    if (!inviteCode) {
      const params = new URLSearchParams(window.location.search);
      inviteCode = params.get('code') || '';
    }

    document.getElementById('code').textContent = inviteCode || '—';
    const deepLink = 'penny://invite/' + inviteCode;
    document.getElementById('openLink').href = deepLink;

    if (inviteCode) {
      setTimeout(function() { window.location.href = deepLink; }, 300);
    }
  </script>
</body>
</html>
